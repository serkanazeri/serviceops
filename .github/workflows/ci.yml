name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRANGLER_SEND_METRICS: "false"
      MODEL_MODE: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            test-results/
            public/evaluation.json
            docs/screenshots/
          retention-days: 14
